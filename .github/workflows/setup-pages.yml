name: Bootstrap Pages project, domains, DNS

# One-off (re-runnable, idempotent) bootstrap: create the Pages project if
# missing, publish the current site, attach apex+www as custom domains, and
# point the zone's DNS at the project. Safe to re-run; it only changes what
# differs. Regular publishing stays in deploy.yml.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT: hexesonautomatic
  APEX: hexesonautomatic.com

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ensure the Pages project exists
        run: |
          set -euo pipefail
          status=$(curl -s -o /tmp/project.json -w "%{http_code}" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT")
          if [ "$status" = "200" ]; then
            echo "Project $PROJECT already exists."
          elif [ "$status" = "404" ]; then
            npx --yes wrangler@4 pages project create "$PROJECT" --production-branch=main
          else
            echo "Unexpected HTTP $status looking up the project:"
            cat /tmp/project.json
            exit 1
          fi

      - name: Deploy the site
        run: npx --yes wrangler@4 pages deploy . --project-name "$PROJECT" --branch main

      - name: Attach custom domains to the project
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/domains"
          existing=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base" | jq -r '.result[].name')
          for domain in "$APEX" "www.$APEX"; do
            if echo "$existing" | grep -qx "$domain"; then
              echo "$domain already attached."
              continue
            fi
            resp=$(curl -s -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"name\":\"$domain\"}" "$base")
            echo "$resp" | jq '{success, errors, name: .result.name, status: .result.status}'
            echo "$resp" | jq -e '.success' > /dev/null || exit 1
          done

      - name: Ensure proxied DNS records
        run: |
          set -euo pipefail
          zone=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=$APEX" | jq -r '.result[0].id')
          if [ -z "$zone" ] || [ "$zone" = "null" ]; then
            echo "Zone $APEX not found in this account (or the token cannot read zones)."
            exit 1
          fi
          target="$PROJECT.pages.dev"
          for name in "$APEX" "www.$APEX"; do
            records=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/zones/$zone/dns_records?name=$name")
            match=$(echo "$records" | jq -r --arg t "$target" \
              '.result[] | select(.type=="CNAME" and .content==$t) | .id' | head -1)
            if [ -n "$match" ]; then
              echo "$name already points at $target."
              continue
            fi
            # Only A/AAAA/CNAME at the exact name conflict with the CNAME;
            # MX/TXT etc. are left untouched.
            conflict=$(echo "$records" | jq -r \
              '.result[] | select(.type=="A" or .type=="AAAA" or .type=="CNAME") | .id' | head -1)
            body="{\"type\":\"CNAME\",\"name\":\"$name\",\"content\":\"$target\",\"proxied\":true,\"ttl\":1}"
            if [ -n "$conflict" ]; then
              old=$(echo "$records" | jq -c --arg id "$conflict" \
                '.result[] | select(.id==$id) | {type, content}')
              echo "REPLACING existing record at $name ($old) with CNAME -> $target"
              resp=$(curl -s -X PUT \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                -H "Content-Type: application/json" \
                -d "$body" "https://api.cloudflare.com/client/v4/zones/$zone/dns_records/$conflict")
            else
              echo "Creating CNAME $name -> $target (proxied)"
              resp=$(curl -s -X POST \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                -H "Content-Type: application/json" \
                -d "$body" "https://api.cloudflare.com/client/v4/zones/$zone/dns_records")
            fi
            echo "$resp" | jq '{success, errors}'
            echo "$resp" | jq -e '.success' > /dev/null || exit 1
          done
          echo "Done. Certificates for the custom domains are issued by Pages automatically once validation completes."
