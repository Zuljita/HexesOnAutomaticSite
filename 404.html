<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Hexes on Automatic — Page Not Found</title>
  <link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--surface-app); color: var(--text-body); font-family: var(--font-body); }
    a { color: inherit; text-decoration: none; }
    .wrap { width: min(1040px, 92vw); margin: 0 auto; }
    header { padding: clamp(64px, 12vw, 140px) 0 60px; background: radial-gradient(60% 50% at 20% 0%, rgba(47,143,87,0.16), transparent 70%); }
    .eyebrow { font-family: var(--font-display); font-weight: 600; font-size: 12px; letter-spacing: var(--tracking-eyebrow); text-transform: uppercase; color: var(--brass-300); }
    h1 { max-width: 820px; margin: 14px 0 0; font-family: var(--font-display); color: var(--text-strong); text-transform: uppercase; font-size: clamp(42px, 6vw, 72px); line-height: 1.03; letter-spacing: 0.03em; }
    .lead { max-width: 68ch; margin: 20px 0 0; color: var(--text-muted); font-size: 18px; line-height: 1.65; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin: 34px 0 90px; }
    .action { display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--surface-sunken); color: var(--text-body); font-family: var(--font-display); font-weight: 700; font-size: 14px; letter-spacing: 0.03em; text-transform: uppercase; }
    .action:hover { border-color: var(--brass-400); color: var(--brass-300); }
    .action--primary { border-color: var(--canopy-500); color: var(--canopy-300); }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <span class="eyebrow">Hex not found</span>
      <h1>This hex is off the map.</h1>
      <p class="lead">The page you asked for isn't here &mdash; it may have moved when the site was reorganized, or the link had a typo. The places below are all real.</p>
      <div class="actions">
        <a class="action action--primary" href="index.html">Home</a>
        <a class="action" href="quickstart.html">Quickstart</a>
        <a class="action" href="vault.html">The Vault</a>
        <a class="action" href="releases.html">Releases</a>
        <a class="action" href="https://dungeonsonautomatic.com/">Dungeons on Automatic</a>
      </div>
    </div>
  </header>
</body>
</html>
