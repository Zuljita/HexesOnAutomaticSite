<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Hexes on Automatic mark">
  <defs>
    <clipPath id="hex-clip"><polygon points="46,32 39,44.12 25,44.12 18,32 25,19.88 39,19.88"/></clipPath>
  </defs>
  <!-- Gear ring: the shared "on Automatic" cog, brass like the family mark -->
  <g stroke="#ffd800" fill="none">
    <circle cx="32" cy="32" r="23.5" stroke-width="4.6"/>
    <g stroke-width="6.4">
      <line x1="32" y1="8.5" x2="32" y2="2.5"/>
      <line x1="32" y1="55.5" x2="32" y2="61.5"/>
      <line x1="8.5" y1="32" x2="2.5" y2="32"/>
      <line x1="55.5" y1="32" x2="61.5" y2="32"/>
      <line x1="15.38" y1="15.38" x2="11.14" y2="11.14"/>
      <line x1="48.62" y1="48.62" x2="52.86" y2="52.86"/>
      <line x1="15.38" y1="48.62" x2="11.14" y2="52.86"/>
      <line x1="48.62" y1="15.38" x2="52.86" y2="11.14"/>
    </g>
  </g>
  <!-- Flat-top hex: one map hex where DOA's mark holds a dungeon door -->
  <polygon points="46,32 39,44.12 25,44.12 18,32 25,19.88 39,19.88" fill="#143f27"/>
  <!-- Terrain inside the hex: sun over a two-peak range -->
  <g clip-path="url(#hex-clip)">
    <circle cx="24.5" cy="25.5" r="2.9" fill="#ffd800"/>
    <polygon points="17,45 28,28.5 32.5,34 37,27.5 47,45" fill="#66c08c"/>
  </g>
  <polygon points="46,32 39,44.12 25,44.12 18,32 25,19.88 39,19.88"
           fill="none" stroke="#3ba669" stroke-width="3" stroke-linejoin="round"/>
</svg>
